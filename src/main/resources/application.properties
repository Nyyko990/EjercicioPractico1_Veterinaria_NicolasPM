spring.application.name=PetShop

server.port=8086
#para definir el puerto donde "escuchará" el servidor

logging.pattern.dateformat=hh:mm
#Para definir el formato de despliegue de fecha/hora del log en la consola

spring.main.banner-mode=off
#Para eliminar mensajes invasivos de Spring

spring.thymeleaf.cache=false
#En desarrollo el "cache" del servidor (false), en producción "true"

#Conexión local a la BD veterinaria_citas en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_citas?useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true

#Usuario y clave de veterinaria_citas.sql
spring.datasource.username=usuario_caso_practico_01_var
spring.datasource.password=123456

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Las tablas las crea el script SQL
spring.jpa.hibernate.ddl-auto=none

#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE
