<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::title}, ~{::main})}">
    <head>
        <title th:text="#{aplicacion.titulo} + ' - ' + #{cita.titulo}">PetShop</title>
    </head>
    <body>
        <main>
            <section class="p-3">
                <div class="row p-3">
                    <div class="col-md-9">
                        <div class="card p-2">
                            <div class="card-header"><h4><i class="fas fa-calendar-check"></i> [[#{cita.listado}]]</h4></div>
                            <div class="card-body">
                                <div class="table-responsive" th:if="${citas != null and !citas.empty}">
                                    <table class="table table-striped table-hover">
                                        <thead><tr><th>#</th>
                                                <th>[[#{cita.mascota}]]</th>
                                                <th>[[#{cita.propietario}]]</th>
                                                <th>[[#{cita.fecha}]]</th>
                                                <th>[[#{cita.servicio}]]</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="c : ${citas}">
                                                <td>[[${c.id}]]</td>
                                                <td>[[${c.nombreMascota}]]</td>
                                                <td>[[${c.nombrePropietario}]]</td>
                                                <td>[[${#temporals.format(c.fecha,'dd/MM/yyyy')}]]</td>
                                                <td>[[${c.servicio.nombre}]]</td>
                                            </tr>
                                        </tbody>
                                    </table></div>
                                <div class="text-center p-2" th:if="${citas == null or citas.empty}">
                                    <span>[[#{lista.vacia}]]</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center bg-success text-white mb-3">
                            <div class="card-body"><h3>[[#{cita.total}]]</h3>
                                <h4 class="fs-2"><i class="fas fa-paw"></i> [[${totalCitas}]]</h4>
                            </div></div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
